<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Запись на сдачу зачёта</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Trebuchet MS', 'Segoe UI', Roboto, Arial, sans-serif;
            margin: 0;
            padding: 40px 20px 60px;
            min-height: 100vh;
            color: #22303f;
            background-color: #eef2f8;
            background-attachment: fixed;
        }

        h1 {
            max-width: 1200px;
            margin: 0 auto 32px;
            padding: 26px 30px;
            text-align: center;
            font-size: 34px;
            letter-spacing: 1px;
            color: #666;
            border-radius: 18px;
            box-shadow: 0 12px 26px rgba(29, 53, 87, 0.28);
        }

        form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 28px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .column {
            padding: 28px 30px 10px;
            background-color: #fff;
            border: 1px solid #dfe6f0;
            border-top: 6px solid #457b9d;
            border-radius: 18px;
            box-shadow: 0 10px 24px rgba(29, 53, 87, 0.08);
        }

        .column:nth-of-type(2) {
            border-top-color: #e63946;
        }

        .column h2 {
            position: relative;
            margin: 0 0 22px;
            padding: 0 0 12px 16px;
            font-size: 19px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #1d3557;
            border-bottom: 1px dashed #cdd7e5;
        }

        .column h2::before {
            content: "";
            position: absolute;
            left: 0;
            top: 2px;
            bottom: 14px;
            width: 6px;
            border-radius: 3px;
            background-color: #457b9d;
        }

        .column:nth-of-type(2) h2::before {
            background-color: #e63946;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.4px;
            color: #3d5a80;
        }

        input[type="text"],
        input[type="number"],
        input[type="email"],
        input[type="date"],
        select {
            width: 100%;
            padding: 11px 14px;
            margin-bottom: 20px;
            font-family: inherit;
            font-size: 15px;
            color: #22303f;
            background-color: #f2f5fa;
            border: 2px solid #e2e9f2;
            border-radius: 10px;
            transition: border-color 0.2s ease, background-color 0.2s ease, box-shadow 0.2s ease;
        }

        input:focus,
        select:focus {
            outline: none;
            background-color: #fff;
            border-color: #457b9d;
            box-shadow: 0 0 0 4px rgba(69, 123, 157, 0.15);
        }

        .radio-group,
        .checkbox-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
        }

        .radio-group label,
        .checkbox-group label {
            display: inline-flex;
            align-items: center;
            margin: 0;
            padding: 8px 15px;
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 0;
            color: #3d5a80;
            background-color: #f2f5fa;
            border: 2px solid #e2e9f2;
            border-radius: 999px;
            cursor: pointer;
            transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease;
        }

        .radio-group label:hover,
        .checkbox-group label:hover {
            background-color: #e8eff8;
            border-color: #a8c0d8;
        }

        .radio-group input,
        .checkbox-group input {
            margin: 0 7px 0 0;
            accent-color: #e63946;
            cursor: pointer;
        }

        input.user-valid,
        input:user-valid {
            border-color: #2a9d8f;
            background-color: #eefaf7;
        }

        input.user-invalid,
        input:user-invalid {
            border-color: #e63946;
            background-color: #fdeef0;
        }

        input:invalid:not(:placeholder-shown) {
            border-color: #e63946;
        }

        button[type="submit"] {
            grid-column: 1 / -1;
            justify-self: center;
            margin-top: 8px;
            padding: 15px 70px;
            font-family: inherit;
            font-size: 17px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: #fff;
            background: linear-gradient(120deg, #1d3557, #457b9d);
            border: none;
            border-radius: 999px;
            cursor: pointer;
            box-shadow: 0 10px 22px rgba(29, 53, 87, 0.28);
            transition: background 0.25s ease, transform 0.25s ease, box-shadow 0.25s ease;
        }

        button[type="submit"]:hover {
            background: linear-gradient(120deg, #e63946, #b02a37);
            transform: translateY(-3px);
            box-shadow: 0 14px 28px rgba(230, 57, 70, 0.35);
        }

        button[type="submit"]:active {
            transform: translateY(0);
            box-shadow: 0 6px 14px rgba(29, 53, 87, 0.25);
        }

        @media (max-width: 820px) {
            body {
                padding: 24px 14px 40px;
            }

            h1 {
                padding: 20px;
                font-size: 24px;
            }

            form {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            .column {
                padding: 22px 20px 6px;
            }

            button[type="submit"] {
                width: 100%;
                padding: 15px 20px;
            }
        }
    </style>
</head>
<body>

    <h1>Запись на сдачу зачёта</h1>

    <form>

        <div class="column">
            <h2>Информация о студенте</h2>

            <label for="fullname">ФИО студента:</label>
            <input type="text"
                   id="fullname"
                   name="fullname"
                   placeholder="Иванов Иван Иванович"
                   maxlength="256"
                   pattern="[А-ЯЁ][а-яё]+\s[А-ЯЁ][а-яё]+\s[А-ЯЁ][а-яё]+"
                   title="Введите три слова на кириллице: Фамилия Имя Отчество"
                   autofocus
                   required />

            <label for="course">Курс:</label>
            <input type="number"
                   id="course"
                   name="course"
                   placeholder="1"
                   min="1"
                   max="6"
                   title="Курс должен быть от 1 до 6" />

            <label>Факультет:</label>
            <div class="radio-group">
                <label>
                    <input type="radio" name="faculty" value="IT" checked />
                    ИТ
                </label>
                <label>
                    <input type="radio" name="faculty" value="Economics" />
                    Экономический
                </label>
                <label>
                    <input type="radio" name="faculty" value="Humanities" />
                    Гуманитарный
                </label>
            </div>

            <label for="email">Электронная почта:</label>
            <input type="email"
                   id="email"
                   name="email"
                   placeholder="student@example.com"
                   maxlength="256"
                   title="Введите адрес электронной почты" />

            <label>Интересы:</label>
            <div class="checkbox-group">
                <label>
                    <input type="checkbox" name="interests" value="tech" />
                    Технологии
                </label>
                <label>
                    <input type="checkbox" name="interests" value="psychology" />
                    Психология
                </label>
                <label>
                    <input type="checkbox" name="interests" value="literature" />
                    Литература
                </label>
                <label>
                    <input type="checkbox" name="interests" value="auto" />
                    Авто
                </label>
            </div>

            <label for="group">Группа:</label>
            <input type="text"
                   id="group"
                   name="group"
                   placeholder="1234"
                   maxlength="4"
                   pattern="\d{4}"
                   title="Только цифры, 4 символа (например, 1234)"
                   required />
        </div>

        <div class="column">
            <h2>Информация о сдаче</h2>

            <label for="subject">Предмет для сдачи:</label>
            <select id="subject" name="subject" required>
                <option value="" disabled selected>— выберите предмет —</option>
                <option value="web">Веб-технологии</option>
                <option value="math">Математический анализ</option>
                <option value="programming">Программирование</option>
                <option value="databases">Методы оптимизации</option>
                <option value="physics">Баскетбол</option>
            </select>

            <label for="teacher">Преподаватель:</label>
            <input type="text"
                   id="teacher"
                   name="teacher"
                   placeholder="Иванова Татьяна Петровна"
                   maxlength="256"
                   pattern="[А-ЯЁ][а-яё]+\s[А-ЯЁ][а-яё]+\s[А-ЯЁ][а-яё]+"
                   title="Введите три слова на кириллице: Фамилия Имя Отчество" />

            <label for="date">Дата сдачи:</label>
            <input type="date"
                   id="date"
                   name="date"
                   title="Выберите дату сдачи" />

            <label>Форма сдачи:</label>
            <div class="radio-group">
                <label>
                    <input type="radio" name="format" value="offline" checked />
                    Очная
                </label>
                <label>
                    <input type="radio" name="format" value="online" />
                    Дистанционная
                </label>
            </div>
        </div>

        <button type="submit">Записаться</button>

    </form>

</body>
</html>
